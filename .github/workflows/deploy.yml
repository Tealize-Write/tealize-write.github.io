name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.js
        run: |
          cat > js/config.js << 'EOF'
          window.TEALIZE_GAS_URL = "GAS_URL_PLACEHOLDER";
          window.TEALIZE_TOKEN   = "TOKEN_PLACEHOLDER";
          EOF
          sed -i "s|GAS_URL_PLACEHOLDER|${{ secrets.GAS_URL }}|g" js/config.js
          sed -i "s|TOKEN_PLACEHOLDER|${{ secrets.TOKEN }}|g"     js/config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
